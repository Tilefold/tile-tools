  Folder Tree's page: the folder the focused pane is in, as a tree. It only
  draws (tree.js); the tile lists folders and opens files through Tilefold.
  It stays hidden until the tile sends the tree, with its text.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Folder Tree</title>
    <link rel="stylesheet" href="tree.css" />
    <script type="module" src="tree.js"></script>
  </head>
  <body>
    <main id="tree-view" hidden>
      <header>
        <div class="where">
          <h1 id="title"></h1>
          <p id="path" dir="ltr"></p>
        </div>
        <button id="refresh" type="button"></button>
      </header>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="list" role="tree"></ul>
    </main>
  </body>
</html>
