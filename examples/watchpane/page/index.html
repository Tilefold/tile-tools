  Watchpane's page: a box to paste a YouTube link, YouTube's own player, and
  the videos watched lately. All text arrives from the tile in the user's
  language; watch.js loads YouTube's player script itself.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchpane</title>
    <link rel="stylesheet" href="watch.css" />
    <script type="module" src="watch.js"></script>
  </head>
  <body>
    <main>
      <form id="paste" autocomplete="off">
        <input id="link" type="text" inputmode="url" spellcheck="false" />
        <button id="play" type="submit"></button>
      </form>
      <div class="stage">
        <div id="player"></div>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="recent-box" hidden>
        <h2 id="recent-title"></h2>
        <div id="recent"></div>
      </section>
    </main>
  </body>
</html>
