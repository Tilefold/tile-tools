  Tuneboard's page. Hidden, it only plays sound (player.js); shown as a
  window, it is the Library, the user's playlists (library.js). The Library
  stays hidden until the tile says to show it.
  player.js must load before Spotify's script, which calls it when ready.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tuneboard</title>
    <link rel="stylesheet" href="library.css" />
    <script src="player.js"></script>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script type="module" src="library.js"></script>
  </head>
  <body>
    <main id="library" hidden>
      <header>
        <h1 id="title"></h1>
        <button id="refresh" type="button"></button>
      </header>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="list"></div>
      <button id="more" type="button" hidden></button>
    </main>
  </body>
</html>
