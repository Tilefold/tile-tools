  Gomoku's page: the lobby (your name, start a game or join one with a
  code), the code to send while waiting for the other player, and the
  board with whose turn it is. All text arrives from the tile in the
  user's language; main.js is built from page-src/.

  Modified 2026-10-29 (playing an AI agent): the lobby's "Play against an
    agent" button.
  Modified 2026-10-29 (undo): the Undo button, and the other player's
    request to undo with Allow and Decline.

  Last updated by: Tilefold
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gomoku</title>
    <link rel="stylesheet" href="gomoku.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main class="app">
      <header>
        <h1 id="title"></h1>
        <span id="conn" class="conn" aria-hidden="true"></span>
        <button id="close" class="icon" type="button">×</button>
      </header>

      <section id="lobby">
        <p id="intro" class="intro"></p>
        <label id="name-label" for="name"></label>
        <input id="name" type="text" autocomplete="nickname" spellcheck="false" />
        <button id="new" class="primary" type="button"></button>
        <button id="versus" class="versus" type="button"></button>
        <div class="join">
          <label id="code-label" for="code"></label>
          <div class="join-row">
            <input id="code" type="text" autocomplete="off" spellcheck="false" maxlength="9" />
            <button id="join" type="button"></button>
          </div>
        </div>
        <p id="error" class="message" role="alert" hidden></p>
        <button id="cancel-connect" type="button" hidden></button>
      </section>

      <section id="waiting" hidden>
        <p id="waiting-title" class="lead"></p>
        <input id="room-code" class="code" type="text" readonly aria-labelledby="waiting-title" />
        <button id="copy" class="primary" type="button"></button>
        <p id="waiting-hint" class="hint"></p>
        <p id="waiting-status" class="message" role="status" aria-live="polite"></p>
        <button id="cancel" type="button"></button>
      </section>

      <section id="game" hidden>
        <div class="players">
          <span id="me" class="player"></span>
          <span id="them" class="player"></span>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div id="board" class="board"></div>
        <p id="offer" class="offer" hidden></p>
        <div id="undo-offer" class="undo-offer" role="alert" hidden>
          <span id="undo-text"></span>
          <span class="undo-buttons">
            <button id="undo-allow" class="primary" type="button"></button>
            <button id="undo-decline" type="button"></button>
          </span>
        </div>
        <div class="actions">
          <button id="rematch" class="primary" type="button" hidden></button>
          <button id="undo" type="button" hidden></button>
          <button id="resign" type="button" hidden></button>
          <button id="leave" type="button"></button>
        </div>
      </section>
    </main>
  </body>
</html>
