  Quiz's page: the borderless card with the list of quizzes, or one
  question at a time with its choices, whether the answer was right and
  why, and the score at the end. All text arrives from the tile in the
  user's language; main.js is built from page-src/.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz</title>
    <link rel="stylesheet" href="quiz.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main class="card">
      <header>
        <button id="back" class="icon" type="button" hidden>☰</button>
        <span id="progress" class="progress"></span>
        <button id="place" class="icon" type="button" hidden>⇥</button>
        <button id="theme" class="icon" type="button">☾</button>
        <button id="close" class="icon" type="button">×</button>
      </header>
      <section id="list" hidden>
        <div id="quizzes" class="quizzes"></div>
        <p id="hint" class="hint"></p>
      </section>
      <section id="asking" hidden>
        <h1 id="question" class="question"></h1>
        <div id="choices" class="choices"></div>
        <div id="answer" class="answer" hidden>
          <p id="result" class="result" role="status" aria-live="polite"></p>
          <p id="why" class="why"></p>
          <button id="next" class="primary" type="button"></button>
        </div>
      </section>
      <section id="done" class="done" hidden>
        <p id="score" class="score" role="status" aria-live="polite"></p>
        <button id="again" class="primary" type="button"></button>
      </section>
      <div id="resize" class="resize" aria-hidden="true"></div>
    </main>
  </body>
</html>
